kind = "web"
previewPath = "/"
title = "MedQorix"
description = "A responsive biomedical-waste operations platform for hospital teams, with AI-assisted identification, collection workflows, traceability, and admin analytics in demo mode."
version = "1.0.0"
id = "artifacts/medqorix"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19105

[services.development]
run = "pnpm --filter @workspace/medqorix run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/medqorix", "run", "build" ]
serve = "static"
publicDir = "artifacts/medqorix/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19105"
BASE_PATH = "/"
